# Stack isolada do ACT Squad — não compartilha rede, volume nem containers com a Odisseia.
# Odisseia: projeto odisseia, porta host 80, volume odisseia-pgdata
# ACT:     projeto act,     porta host 8088, volume act-pgdata
name: act

services:
  postgres:
    image: postgres:16-alpine
    container_name: act-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: act
      POSTGRES_USER: ${POSTGRES_USER:-act}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    volumes:
      - act-pgdata:/var/lib/postgresql/data
      - ./app/sql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./app/sql/002_seed_demo.sql:/docker-entrypoint-initdb.d/002_seed_demo.sql:ro
    networks:
      - act-net
    # Postgres só na rede interna do ACT (não publica porta no host)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d act"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./act-api
    container_name: act-api
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/act
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-act}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      ACT_JWT_SECRET: ${ACT_JWT_SECRET:?Defina ACT_JWT_SECRET}
      ACT_TERMS_VERSION: ${ACT_TERMS_VERSION:-2026-10}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - act-net
    # API só interna; o nginx (web) faz proxy de /api/
    expose:
      - "8080"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: act-web
    restart: unless-stopped
    ports:
      # Host dedicado do ACT (Odisseia usa 80)
      - "${ACT_HOST_PORT:-8088}:80"
    depends_on:
      - api
    networks:
      - act-net

networks:
  act-net:
    name: act-net
    driver: bridge

volumes:
  act-pgdata:
    name: act-pgdata
