spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/act
    username: ${ACT_DB_USER:postgres}
    password: ${ACT_DB_PASSWORD:act123}
  flyway:
    enabled: false
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true

logging:
